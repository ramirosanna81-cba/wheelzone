<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Background metallic tone -->
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>

    <!-- 3D embossed lug highlight/shadow -->
    <linearGradient id="lugGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555861"/>
      <stop offset="25%" stop-color="#363942"/>
      <stop offset="70%" stop-color="#1e2025"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <linearGradient id="lugGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555861"/>
      <stop offset="25%" stop-color="#363942"/>
      <stop offset="70%" stop-color="#1e2025"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Diamond lug shape: tapered rounded lozenge -->
    <g id="lug">
      <!-- Cast Shadow -->
      <path d="M 0,-11 C 2.5,-10 3.8,-5 3.5,0 C 3.8,5 2.5,10 0,11 C -2.5,10 -3.8,5 -3.5,0 C -3.8,-5 -2.5,-10 0,-11 Z" 
            transform="translate(1.5, 2)" fill="#000000" opacity="0.85"/>
      <!-- Outer Emboss Edge -->
      <path d="M 0,-11 C 2.5,-10 3.8,-5 3.5,0 C 3.8,5 2.5,10 0,11 C -2.5,10 -3.8,5 -3.5,0 C -3.8,-5 -2.5,-10 0,-11 Z" 
            fill="url(#lugGradA)" stroke="#1a1c20" stroke-width="0.75"/>
      <!-- Inner Specular Ridge -->
      <path d="M 0,-9 C 1.2,-7 1.6,-3 1.3,0 C 1.6,3 1.2,7 0,9 C -0.4,7 -0.7,3 -0.5,0 C -0.7,-3 -0.4,-7 0,-9 Z" 
            fill="#454952" opacity="0.6"/>
      <!-- Top Tip Specular Spark -->
      <circle cx="0" cy="-6" r="0.8" fill="#8e95a5" opacity="0.7"/>
    </g>

    <g id="lugRev">
      <!-- Cast Shadow -->
      <path d="M 0,-11 C 2.5,-10 3.8,-5 3.5,0 C 3.8,5 2.5,10 0,11 C -2.5,10 -3.8,5 -3.5,0 C -3.8,-5 -2.5,-10 0,-11 Z" 
            transform="translate(1.5, 2)" fill="#000000" opacity="0.85"/>
      <!-- Outer Emboss Edge -->
      <path d="M 0,-11 C 2.5,-10 3.8,-5 3.5,0 C 3.8,5 2.5,10 0,11 C -2.5,10 -3.8,5 -3.5,0 C -3.8,-5 -2.5,-10 0,-11 Z" 
            fill="url(#lugGradB)" stroke="#1a1c20" stroke-width="0.75"/>
      <!-- Inner Specular Ridge -->
      <path d="M 0,-9 C 1.2,-7 1.6,-3 1.3,0 C 1.6,3 1.2,7 0,9 C -0.4,7 -0.7,3 -0.5,0 C -0.7,-3 -0.4,-7 0,-9 Z" 
            fill="#454952" opacity="0.6"/>
      <!-- Top Tip Specular Spark -->
      <circle cx="0" cy="-6" r="0.8" fill="#8e95a5" opacity="0.7"/>
    </g>
  </defs>

  <!-- Plate background -->
  <rect width="64" height="64" fill="url(#metalPlate)"/>

  <!-- Subtle steel grain / noise dots -->
  <circle cx="10" cy="8" r="0.5" fill="#303238" opacity="0.3"/>
  <circle cx="52" cy="18" r="0.5" fill="#303238" opacity="0.3"/>
  <circle cx="28" cy="48" r="0.5" fill="#303238" opacity="0.3"/>
  <circle cx="44" cy="58" r="0.5" fill="#303238" opacity="0.3"/>

  <!-- Diamond Plate Pattern: Pairs angled at 45° and -45° -->
  <!-- Top Left: rotated 45° -->
  <use href="#lug" transform="translate(16, 16) rotate(45)"/>
  
  <!-- Bottom Right: rotated 45° -->
  <use href="#lug" transform="translate(48, 48) rotate(45)"/>

  <!-- Top Right: rotated -45° -->
  <use href="#lugRev" transform="translate(48, 16) rotate(-45)"/>

  <!-- Bottom Left: rotated -45° -->
  <use href="#lugRev" transform="translate(16, 48) rotate(-45)"/>
</svg>
